# ──────────────────────────────────────────────────────────────────────────────
# Aetheris Health AI — CI Pipeline
#
# Runs backend (Python), Hospital frontend and Patient App (Node) quality
# checks on every push to develop and on pull requests.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aetheris
          POSTGRES_PASSWORD: aetheris
          POSTGRES_DB: aetheris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aetheris -d aetheris"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://aetheris:aetheris@localhost:5432/aetheris
      REDIS_URL: redis://localhost:6379/0
      # Must be a member of AppEnv (development / staging / production) —
      # Settings rejects anything else at import, so every test file failed
      # to collect under the previous value `test`. This matches how the suite
      # runs locally and in docker compose.
      APP_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check app/

      - name: Ruff format check
        run: uv run ruff format --check app/

      - name: Mypy type check
        run: uv run mypy app/

      # The suite runs against `<DATABASE_URL>_test`, never the configured
      # database, but the service container only creates `aetheris`. Without
      # this step the engine fixture cannot connect and *skips* every
      # database-backed test — CI would pass while testing none of them.
      - name: Create test database
        env:
          PGPASSWORD: aetheris
        run: psql -h localhost -U aetheris -d aetheris -c "CREATE DATABASE aetheris_test"

      - name: Run tests
        run: uv run pytest app/tests/ -v

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # jsdom's undici dependency requires Node >= 22.19; on Node 20 the vitest
      # workers crash on startup ("webidl.util.markAsUncloneable is not a
      # function") before a single test runs.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Patient App ──────────────────────────────────────────────────────────
  # A separate Vite workspace (patient-app/), with its own lockfile and its
  # own build. It shares nothing with frontend/ at build time; the design
  # token check reads frontend/src/index.css, so the whole repo is checked out.
  patient-app:
    name: Patient App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same Node floor as the Hospital frontend: jsdom's undici dependency
      # requires Node >= 22.19.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: patient-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Design tokens match the Hospital frontend
        run: npm run check:tokens

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
