# ──────────────────────────────────────────────────────────────────────────────
# Aetheris Health AI — CI Pipeline
#
# Runs backend (Python) and frontend (Node) quality checks on every push
# to develop and on pull requests.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aetheris
          POSTGRES_PASSWORD: aetheris
          POSTGRES_DB: aetheris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aetheris -d aetheris"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://aetheris:aetheris@localhost:5432/aetheris
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check app/

      - name: Ruff format check
        run: uv run ruff format --check app/

      - name: Mypy type check
        run: uv run mypy app/

      - name: Run tests
        run: uv run pytest app/tests/ -v

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
