[project]
name = "aetheris"
version = "0.1.0"
description = "Aetheris Health AI — Enterprise Hospital Management Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Aetheris Health", email = "dev@aetheris.health" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",

    # Database
    "sqlalchemy>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "greenlet>=3.1.0,<4.0.0",

    # Validation & settings
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pydantic-extra-types>=2.10.0,<3.0.0",
    # Required by pydantic.EmailStr, which app/schemas/{auth,user}.py already
    # use. Without it `from app.main import create_app` raises ImportError, so
    # the application cannot start. Declaring an existing requirement, not
    # adding a new dependency.
    "email-validator>=2.0.0,<3.0.0",

    # Logging
    "structlog>=24.4.0,<25.0.0",

    # Auth
    "passlib[argon2]>=1.7.4,<2.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "pyotp>=2.9.0,<3.0.0",

    # Cryptography
    "cryptography>=44.0.0,<45.0.0",

    # Caching & queues
    "redis>=5.2.0,<6.0.0",
    # Background jobs. `backend/CLAUDE.md` sanctions Celery or Arq; Arq is the
    # async-native one, so it needs no sync bridge in an all-async stack, and it
    # runs on the Redis connection already configured above. Required by the
    # no-show sweeper (docs/modules/05-appointment-management.md §5.7, FR-7).
    "arq>=0.26.0,<1.0.0",

    # HTTP client (for AI providers, external APIs)
    "httpx>=0.28.0,<1.0.0",

    # YAML (for prompt templates)
    "pyyaml>=6.0,<7.0",

    # Metrics
    "prometheus-client>=0.21.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    # Property-based tests for invoice arithmetic (docs/modules/06-billing.md §16).
    "hypothesis>=6.100.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
    "pre-commit>=4.1.0,<5.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Ruff config lives in ruff.toml; mypy config lives in mypy.ini.
# See docs/09-PROJECT_STRUCTURE.md (backend root file list).
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["app/tests"]
asyncio_mode = "auto"
# One event loop for the whole session. The database engine and connection pool
# are session-scoped, and an asyncpg connection is bound to the loop that
# created it — per-test loops make every database fixture fail with
# "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
python_files = ["test_*.py"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:alembic.*",
    "ignore::DeprecationWarning:argon2.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/**/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
]
